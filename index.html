
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>Nova AI — Smart Chat</title>

<style>
:root {
  --bg: #09090b;
  --panel: #111114;
  --panel2: #19191f;
  --border: #292930;
  --text: #f4f4f5;
  --muted: #92929f;
  --accent: #a78bfa;
  --accent2: #7c3aed;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.app {
  display: flex;
  width: 100%;
  height: 100dvh;
}

/* SIDEBAR */
.sidebar {
  width: 265px;
  flex-shrink: 0;
  background: #0d0d10;
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px 14px;
}

.logo {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(135deg, #c4b5fd, #7c3aed);
  color: white;
  font-size: 22px;
  font-weight: 800;
}

.brand h2 { margin: 0; font-size: 18px; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }

.new-chat {
  padding: 12px;
  color: white;
  background: var(--accent2);
  border: 0;
  border-radius: 10px;
  text-align: left;
  font-weight: 600;
}

.new-chat:hover { background: #6d28d9; }

.side-label {
  color: #777782;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  padding: 0 9px;
  text-transform: uppercase;
}

.history {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow-y: auto;
  flex: 1;
}

.history-item {
  padding: 10px;
  color: #b8b8c3;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-item:hover, .history-item.active {
  background: var(--panel2);
  color: white;
}

.side-bottom {
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.settings-button, .mobile-menu {
  width: 100%;
  padding: 10px;
  text-align: left;
  border: 0;
  color: #c4c4ce;
  background: transparent;
  border-radius: 8px;
}

.settings-button:hover, .mobile-menu:hover {
  background: var(--panel2);
}

/* MAIN LAYOUT */
.main {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 67px;
  border-bottom: 1px solid var(--border);
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.top-title { font-size: 14px; font-weight: 650; }

.model-select {
  max-width: 220px;
  background: var(--panel2);
  color: #ddd6fe;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px;
  font-size: 12px;
  outline: none;
}

.status {
  color: #a1a1aa;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.dot {
  width: 7px;
  height: 7px;
  background: #34d399;
  border-radius: 50%;
}

/* CHAT AREA */
.chat-scroll {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
}

.chat {
  max-width: 850px;
  margin: 0 auto;
  padding: 32px 24px;
}

.welcome {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 25px 0 55px;
}

.welcome-logo {
  width: 62px;
  height: 62px;
  display: grid;
  place-items: center;
  font-size: 30px;
  border-radius: 21px;
  background: linear-gradient(135deg, #292044, #15111f);
  border: 1px solid #46366d;
  margin-bottom: 25px;
}

.welcome h1 {
  font-size: clamp(30px, 4vw, 46px);
  letter-spacing: -1.8px;
  margin: 0 0 12px;
  line-height: 1.15;
}

.gradient {
  background: linear-gradient(90deg, #c4b5fd, #818cf8);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.welcome > p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  max-width: 520px;
  margin: 0 0 28px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  max-width: 620px;
}

.suggestion {
  text-align: left;
  background: #111115;
  border: 1px solid var(--border);
  color: #e4e4e7;
  padding: 15px;
  border-radius: 12px;
  transition: .2s;
}

.suggestion:hover {
  border-color: #7658bd;
  background: #191521;
  transform: translateY(-2px);
}

.suggestion strong {
  display: block;
  font-size: 12px;
  margin-bottom: 7px;
}

.suggestion span {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

/* MESSAGES */
.message {
  display: flex;
  gap: 13px;
  margin: 0 0 27px;
  align-items: flex-start;
}

.avatar {
  width: 31px;
  height: 31px;
  flex-shrink: 0;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 800;
}

.user-avatar { background: #30303a; }
.ai-avatar {
  background: linear-gradient(135deg, #8b5cf6, #5b21b6);
}

.message-content { min-width: 0; flex: 1; }

.message-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 4px 0 10px;
  font-size: 12px;
  font-weight: 650;
}

.message-text {
  font-size: 13px;
  line-height: 1.85;
  color: #dedee5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message-text code {
  font-family: Consolas, monospace;
  background: #27202f;
  padding: 2px 5px;
  border-radius: 4px;
}

.message-text pre {
  background: #09090b;
  border: 1px solid var(--border);
  padding: 14px;
  border-radius: 10px;
  overflow-x: auto;
  white-space: pre;
}

.message-text pre code {
  background: transparent;
  padding: 0;
}

.message-actions {
  display: flex;
  gap: 7px;
  margin-top: 9px;
}

.small-btn {
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 10px;
}

.small-btn:hover { color: white; }

/* COMPOSER */
.composer-wrap {
  padding: 14px 24px 10px;
  background: linear-gradient(transparent, var(--bg) 15%);
}

.composer {
  max-width: 800px;
  margin: 0 auto;
  border: 1px solid #393440;
  background: #151518;
  border-radius: 17px;
  padding: 12px 12px 9px 16px;
  transition: border-color .2s;
}

.composer:focus-within { border-color: #8060c5; }

#prompt {
  display: block;
  width: 100%;
  min-height: 43px;
  max-height: 180px;
  resize: none;
  border: 0;
  outline: none;
  color: white;
  background: transparent;
  padding: 7px 0;
  font-size: 13px;
  line-height: 1.6;
}

#prompt::placeholder { color: #777783; }

.composer-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.composer-hint {
  font-size: 10px;
  color: #777783;
}

.send-btn {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 10px;
  color: white;
  background: var(--accent2);
  display: grid;
  place-items: center;
  font-size: 17px;
}

.send-btn:disabled { opacity: .45; cursor: not-allowed; }

.disclaimer {
  max-width: 800px;
  margin: 10px auto 0;
  text-align: center;
  color: #696974;
  font-size: 10px;
}

.typing {
  display: flex;
  gap: 5px;
  padding: 6px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse .8s infinite alternate;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes pulse {
